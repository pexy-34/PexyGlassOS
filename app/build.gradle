
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.glassos.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.glassos.launcher'
        minSdk 24
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
}
